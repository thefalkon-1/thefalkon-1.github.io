{% extends "base.html" %}

{% block title %}{{ tag }} - {{ SITENAME }}{% endblock %}

{% block content %}
<div class="tag-page">
  <h1>Posts tagged "{{ tag }}"</h1>
  <div class="posts">
    {% for article in articles %}
    <article class="post-preview">
      <div class="post-date">{{ article.date.strftime('%Y-%m-%d') }}</div>
      <h2 class="post-title"><a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a></h2>
    </article>
    {% endfor %}
  </div>
</div>
{% endblock %}
