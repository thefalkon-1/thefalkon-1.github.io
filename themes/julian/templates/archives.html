{% extends "base.html" %}

{% block title %}Archives - {{ SITENAME }}{% endblock %}

{% block content %}
<div class="archives">
  <h1>Archives</h1>
  {% for article in articles %}
  <div class="archive-item">
    <span class="archive-date">{{ article.date.strftime('%Y-%m-%d') }}</span>
    <a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
